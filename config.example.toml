# quant-trader 실전 매매 설정 예시.
# 이 파일을 config.toml 로 복사한 뒤 값을 채우세요. config.toml 은 git 에 올라가지 않습니다.

[live]
broker = "paper"          # "paper"(가상) 또는 "kis"(한국투자증권). 처음엔 paper 로 시작하세요.
tickers = ["SPY", "QQQ", "TLT", "GLD"]   # 국내: "005930.KS", "069500.KS" (국내/미국은 섞지 않는 것을 권장)
strategy = "ensemble"       # 평가 세트에서 가장 강건했던 전략 (research/LOG.md)
period = "2y"             # 신호 계산에 쓸 과거 데이터 길이
fee_pct = 0.0015
threshold = 0.02          # 목표-현재 비중 차이가 2% 미만이면 주문하지 않음
order_type = "market"     # "market" 시장가 / "limit" 지정가(현재가 기준)
log_dir = "live_log"

[live.params]             # 전략 파라미터 (생략하면 기본값). ensemble 은 기본값 권장.
# members = "tranched(base=trend_invvol),tranched(base=momentum_ensemble),buy_hold"

[kis]                     # 한국투자증권 KIS Developers (https://apiportal.koreainvestment.com)
app_key = ""              # 또는 환경변수 KIS_APP_KEY
app_secret = ""           # 또는 환경변수 KIS_APP_SECRET
account_no = "12345678-01"  # 계좌번호 8자리-상품코드 2자리. 환경변수 KIS_ACCOUNT_NO
mode = "vts"              # "vts" 모의투자 (반드시 먼저) / "prod" 실전

[kis.us_exchange]         # 미국 종목 거래소 코드 추가 (NASD / NYSE / AMEX). 기본 목록에 없는 종목만.
# VNQ = "AMEX"

[risk]                    # 실전 주문 전 반드시 거치는 한도
max_position_weight = 0.5      # 한 종목 최대 비중
max_order_value = 0            # 1회 주문 최대 금액 (0 = 제한 없음). 예: 3000000
max_orders_per_run = 20
max_daily_loss_pct = 0.05      # 당일 -5% 넘으면 신규 매수 중단
allowed_tickers = []           # 비어 있으면 tickers 전부 허용
kill_switch_file = "STOP_TRADING"   # 프로젝트 루트에 이 파일을 만들면 모든 주문 중단
min_order_value = 0
